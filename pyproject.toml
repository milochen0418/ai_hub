[tool.poetry]
name = "ai-hub"
version = "0.1.0"
description = "AI Hub: one door between AI (Claude, Ollama, agents over MCP) and the apps of re_ddns"
authors = ["Milo Chen"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# Developed on 3.11 (see AGENTS.md), the Python of the re_ddns App Store image (python:3.11);
# also installs and runs on 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
PyJWT = ">=2.8"
httpx = ">=0.28"
# Claude, through the official SDK (2.x: API version 2026-10-21).
anthropic = ">=2.2,<3"
# The MCP address for agents (Streamable HTTP, official SDK).
mcp = ">=2.3,<3"
# Files attached in the assistant, made into what models take: pictures (Pillow), PDF pages
# (pdfium) and video frames (ffmpeg, bundled: the App Store image has none).
pillow = ">=12"
pypdfium2 = ">=5,<6"
imageio-ffmpeg = ">=0.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
