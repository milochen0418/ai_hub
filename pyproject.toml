[tool.poetry]
name = "ai-hub"
version = "0.1.0"
description = "AI Hub: one door between AI (Claude, Ollama, agents over MCP) and the apps of re_ddns"
authors = ["Milo Chen"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# Developed on 3.11 (see AGENTS.md), the Python of the re_ddns App Store image (python:3.11);
# also installs and runs on 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
PyJWT = ">=2.8"
httpx = ">=0.28"
# Claude, through the official SDK (2.x: API version 2026-10-21).
anthropic = ">=2.2,<3"
# The MCP address for agents (Streamable HTTP, official SDK).
mcp = ">=2.3,<3"
# Files attached in the assistant, made into what models take: pictures (Pillow), PDF pages
# (pdfium) and video frames (ffmpeg, bundled: the App Store image has none).
pillow = ">=12"
pypdfium2 = ">=5,<6"
imageio-ffmpeg = ">=0.6"
# The talking AI's voice (ai_hub.talk): Kokoro speaks (ONNX; misaki reads Chinese), Whisper hears.
# kokoro-onnx says Python <3.14, misaki <3.13, and faster-whisper's wheels (ctranslate2) stop at
# 3.14 for now: on a newer Python the hub installs without them and the browser's own speech is
# used instead (for Chinese alone, when only misaki is missing).
kokoro-onnx = {version = ">=0.6,<1", python = "<3.14"}
misaki = {version = ">=0.9,<1", extras = ["zh"], python = "<3.13"}
faster-whisper = {version = ">=1.1,<2", python = "<3.15"}
numpy = {version = ">=1.26,<2.4", python = "<3.15"}
opencc-python-reimplemented = ">=0.1.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
